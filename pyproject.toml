[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world-lantern-hollow"
version = "0.2.3"
description = "A small persistent pixel world."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["agent-world @ git+https://github.com/Munable/agent-world.git@60ebf42b80e2f32a7e2ab5bc84ca87d43006ad97"]

[project.scripts]
lantern-hollow = "lantern_hollow.server:main"

[tool.setuptools.packages.find]
include = ["lantern_hollow*"]

[tool.setuptools.package-data]
lantern_hollow = ["web/*"]
