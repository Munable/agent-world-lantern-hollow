[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world-lantern-hollow"
dynamic = ["version"]
description = "A small persistent pixel world."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["agent-world @ git+https://github.com/Munable/agent-world.git@422fc56fd63d383fb4dd262981810d88e5db0c73"]

[project.scripts]
lantern-hollow = "lantern_hollow.server:main"

[tool.setuptools.packages.find]
include = ["lantern_hollow*"]

[tool.setuptools.package-data]
lantern_hollow = ["web/*"]

[tool.setuptools.dynamic]
version = {attr = "lantern_hollow.__version__"}
