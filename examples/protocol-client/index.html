<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯溪镇 · 独立协议客户端</title><link rel="stylesheet" href="style.css"></head><body><header><p>PUBLIC PROTOCOL CLIENT</p><h1>同一个世界，独立的画面。</h1><p>只读取公开接口。无需身份令牌，不创建或控制角色。</p><form id="connect"><label for="origin">世界地址</label><input id="origin" type="url" required value="http://127.0.0.1:4669"><button>连接 / 重新连接</button></form><p id="health" role="status">尚未连接</p></header><main><section aria-label="World scene"><label for="focus">关注角色</label><select id="focus"><option value="">全图</option></select><canvas id="scene" width="800" height="520" role="img" aria-label="公开场景；完整角色信息在下方名单"></canvas><p id="art">使用基础图形</p><div id="roles"></div></section><section aria-label="Event history"><h2>发生了什么</h2><p>历史和本次收到的事件分开标记，原话只作为文本显示。本页保留最近 600 条。</p><button id="older" hidden>读取更早记录</button><ol id="events" tabindex="0" aria-label="保留的事件与对话"></ol></section></main><footer>独立的快照、增量、事件、断线恢复及素材实现。没有引入官方前端或内核代码。</footer><script type="module" src="client.js"></script></body></html>
